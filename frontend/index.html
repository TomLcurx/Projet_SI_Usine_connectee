<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Supervision industrielle</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="page-connexion">
    <main class="carte-connexion">
        <div class="logo-usine">SI</div>

        <h1>Supervision industrielle</h1>
        <p class="sous-titre">Connectez-vous à votre espace</p>

        <form id="form-connexion">
            <label for="identifiant">Identifiant</label>
            <input
                type="text"
                id="identifiant"
                name="identifiant"
                autocomplete="username"
                required
            >

            <label for="motDePasse">Mot de passe</label>
            <input
                type="password"
                id="motDePasse"
                name="motDePasse"
                autocomplete="current-password"
                required
            >

            <p id="message-connexion" class="message" role="status"></p>

            <button type="submit" class="bouton-principal">
                Se connecter
            </button>
        </form>

        <div class="separateur"></div>

        <p class="texte-inscription">Vous n'avez pas encore de compte ?</p>
        <a href="pages/creer_profil.html" class="bouton-secondaire">
            Créer un profil
        </a>

        <p class="mention-legale">
            Système de supervision d'automates industriels
        </p>
    </main>
</body>
</html>
