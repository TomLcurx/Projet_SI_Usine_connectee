services:
  db:
    image: mariadb:11.4
    container_name: supervision_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_dev_password
      MARIADB_DATABASE: supervision
      MARIADB_USER: supervision
      MARIADB_PASSWORD: supervision_dev_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: supervision_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: supervision
      DB_PASSWORD: supervision_dev_password
      DB_NAME: supervision
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
